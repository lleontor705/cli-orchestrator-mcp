<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Icon: three connected nodes representing CLI orchestration -->
  <g transform="translate(20, 30)" filter="url(#shadow)">
    <!-- Central hub -->
    <circle cx="70" cy="70" r="32" fill="url(#grad1)" />
    <text x="70" y="78" text-anchor="middle" fill="white" font-family="monospace" font-size="22" font-weight="bold">MCP</text>

    <!-- Node 1 - Claude -->
    <circle cx="10" cy="15" r="16" fill="#f97316" opacity="0.9"/>
    <text x="10" y="20" text-anchor="middle" fill="white" font-family="monospace" font-size="11" font-weight="bold">C</text>
    <line x1="24" y1="26" x2="45" y2="47" stroke="#f97316" stroke-width="2.5" stroke-dasharray="4,3" opacity="0.7"/>

    <!-- Node 2 - Gemini -->
    <circle cx="130" cy="15" r="16" fill="#3b82f6" opacity="0.9"/>
    <text x="130" y="20" text-anchor="middle" fill="white" font-family="monospace" font-size="11" font-weight="bold">G</text>
    <line x1="116" y1="26" x2="95" y2="47" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="4,3" opacity="0.7"/>

    <!-- Node 3 - Codex -->
    <circle cx="70" cy="140" r="16" fill="#10b981" opacity="0.9"/>
    <text x="70" y="145" text-anchor="middle" fill="white" font-family="monospace" font-size="11" font-weight="bold">X</text>
    <line x1="70" y1="124" x2="70" y2="102" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,3" opacity="0.7"/>

    <!-- Circular arrows around hub (orchestration) -->
    <path d="M 46 50 A 30 30 0 0 1 94 50" stroke="url(#grad2)" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 94 90 A 30 30 0 0 1 46 90" stroke="url(#grad2)" stroke-width="2" fill="none" opacity="0.5"/>
  </g>

  <!-- Text -->
  <g transform="translate(195, 55)">
    <text fill="#e2e8f0" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" letter-spacing="-1">
      <tspan>cli-orchestrator</tspan>
    </text>
    <text y="42" fill="#a78bfa" font-family="monospace" font-size="26" font-weight="600" letter-spacing="2">
      <tspan>MCP</tspan>
    </text>
    <text y="78" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="400">
      <tspan>Resilient multi-CLI orchestration for AI agents</tspan>
    </text>
  </g>

  <!-- Version badge -->
  <g transform="translate(350, 90)">
    <rect x="0" y="0" width="52" height="22" rx="4" fill="#6366f1" opacity="0.2"/>
    <text x="26" y="15" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="12" font-weight="600">v1.2.0</text>
  </g>
</svg>
