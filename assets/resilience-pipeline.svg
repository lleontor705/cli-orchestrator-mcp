<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a" />
      <stop offset="100%" style="stop-color:#1e1b4b" />
    </linearGradient>
  </defs>

  <rect width="900" height="340" rx="12" fill="url(#bg)"/>
  <rect width="900" height="340" rx="12" fill="none" stroke="#334155" stroke-width="1"/>

  <text x="450" y="32" text-anchor="middle" fill="#e2e8f0" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="700">Resilience Pipeline</text>

  <!-- Step 1: Request -->
  <rect x="30" y="60" width="120" height="60" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="90" y="85" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="12" font-weight="700">REQUEST</text>
  <text x="90" y="102" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">cli_execute</text>

  <!-- Arrow -->
  <line x1="152" y1="90" x2="178" y2="90" stroke="#6366f1" stroke-width="2"/>
  <polygon points="178,85 188,90 178,95" fill="#6366f1"/>

  <!-- Step 2: Global Budget -->
  <rect x="190" y="60" width="120" height="60" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="250" y="82" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="700">GLOBAL</text>
  <text x="250" y="96" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="700">BUDGET</text>
  <text x="250" y="112" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">300s default</text>

  <!-- Arrow -->
  <line x1="312" y1="90" x2="338" y2="90" stroke="#06b6d4" stroke-width="2"/>
  <polygon points="338,85 348,90 338,95" fill="#06b6d4"/>

  <!-- Step 3: Circuit Breaker -->
  <rect x="350" y="60" width="120" height="60" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="410" y="82" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700">CIRCUIT</text>
  <text x="410" y="96" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700">BREAKER</text>
  <text x="410" y="112" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">per-provider</text>

  <!-- Arrow -->
  <line x1="472" y1="90" x2="498" y2="90" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="498,85 508,90 498,95" fill="#f59e0b"/>

  <!-- Step 4: Execute -->
  <rect x="510" y="60" width="120" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="570" y="82" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">EXECUTE</text>
  <text x="570" y="96" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">CLI</text>
  <text x="570" y="112" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">execa + timeout</text>

  <!-- Arrow -->
  <line x1="632" y1="90" x2="658" y2="90" stroke="#10b981" stroke-width="2"/>
  <polygon points="658,85 668,90 658,95" fill="#10b981"/>

  <!-- Step 5: Result -->
  <rect x="670" y="60" width="120" height="60" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="730" y="82" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="700">REDACT</text>
  <text x="730" y="96" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="700">&amp; RETURN</text>
  <text x="730" y="112" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">secrets removed</text>

  <!-- Retry loop arrow from Execute back -->
  <path d="M 570 122 L 570 155 L 250 155 L 250 122" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="6,3"/>
  <polygon points="246,122 250,112 254,122" fill="#ef4444"/>
  <rect x="340" y="145" width="160" height="20" rx="4" fill="#0f172a"/>
  <text x="420" y="159" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="10" font-weight="600">Retry (max 2, exp backoff)</text>

  <!-- Fallback arrow from Execute -->
  <path d="M 540 122 L 540 190 L 190 190 L 190 122" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-dasharray="6,3"/>
  <polygon points="186,122 190,112 194,122" fill="#f59e0b"/>
  <rect x="295" y="180" width="180" height="20" rx="4" fill="#0f172a"/>
  <text x="385" y="194" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="600">Fallback (next provider)</text>

  <!-- Process Timeout arrow -->
  <path d="M 510 122 L 510 225 L 190 225 L 190 192" stroke="#fb923c" stroke-width="1.5" fill="none" stroke-dasharray="4,4"/>
  <rect x="270" y="215" width="210" height="20" rx="4" fill="#0f172a"/>
  <text x="375" y="229" text-anchor="middle" fill="#fb923c" font-family="monospace" font-size="10" font-weight="600">Process Timeout (skip retries)</text>

  <!-- Legend -->
  <rect x="30" y="260" width="840" height="65" rx="8" fill="#1e293b" opacity="0.5"/>
  <text x="50" y="282" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="600">RETRYABLE:</text>
  <text x="140" y="282" fill="#67e8f9" font-family="monospace" font-size="10">rate limit (429) | server error (503) | ECONNRESET | ETIMEDOUT</text>

  <text x="50" y="300" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="600">NON-RETRYABLE:</text>
  <text x="165" y="300" fill="#fb923c" font-family="monospace" font-size="10">process timeout | auth error | permanent failure</text>

  <text x="50" y="318" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="600">ABORT-AWARE:</text>
  <text x="155" y="318" fill="#f87171" font-family="monospace" font-size="10">AbortSignal cancels process + stops retries + interrupts backoff sleep</text>
</svg>
