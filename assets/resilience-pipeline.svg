<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340">
  <rect width="900" height="340" rx="12" fill="#0f172a"/>
  <rect width="900" height="340" rx="12" fill="none" stroke="#334155" stroke-width="1"/>

  <text x="450" y="32" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="18" font-weight="700">Resilience Pipeline</text>

  <rect x="30" y="60" width="120" height="60" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="90" y="85" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="12" font-weight="700">REQUEST</text>
  <text x="90" y="102" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">cli_execute</text>

  <line x1="152" y1="90" x2="183" y2="90" stroke="#6366f1" stroke-width="2"/>
  <polygon points="183,85 193,90 183,95" fill="#6366f1"/>

  <rect x="195" y="60" width="120" height="60" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="255" y="82" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="700">GLOBAL</text>
  <text x="255" y="96" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="700">BUDGET</text>
  <text x="255" y="112" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">300s default</text>

  <line x1="317" y1="90" x2="343" y2="90" stroke="#06b6d4" stroke-width="2"/>
  <polygon points="343,85 353,90 343,95" fill="#06b6d4"/>

  <rect x="355" y="60" width="120" height="60" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="415" y="82" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700">CIRCUIT</text>
  <text x="415" y="96" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700">BREAKER</text>
  <text x="415" y="112" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">per-provider</text>

  <line x1="477" y1="90" x2="503" y2="90" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="503,85 513,90 503,95" fill="#f59e0b"/>

  <rect x="515" y="60" width="120" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="575" y="82" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">EXECUTE</text>
  <text x="575" y="96" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">CLI</text>
  <text x="575" y="112" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">execa + timeout</text>

  <line x1="637" y1="90" x2="663" y2="90" stroke="#10b981" stroke-width="2"/>
  <polygon points="663,85 673,90 663,95" fill="#10b981"/>

  <rect x="675" y="60" width="120" height="60" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="735" y="82" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="700">REDACT</text>
  <text x="735" y="96" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="700">+ RETURN</text>
  <text x="735" y="112" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">secrets removed</text>

  <path d="M 575 122 L 575 155 L 255 155 L 255 122" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="6,3"/>
  <polygon points="251,122 255,112 259,122" fill="#ef4444"/>
  <rect x="340" y="145" width="160" height="20" rx="4" fill="#0f172a"/>
  <text x="420" y="159" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="10" font-weight="600">Retry (max 2, exp backoff)</text>

  <path d="M 545 122 L 545 190 L 195 190 L 195 122" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-dasharray="6,3"/>
  <polygon points="191,122 195,112 199,122" fill="#f59e0b"/>
  <rect x="295" y="180" width="180" height="20" rx="4" fill="#0f172a"/>
  <text x="385" y="194" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="600">Fallback (next provider)</text>

  <path d="M 515 122 L 515 225 L 195 225 L 195 192" stroke="#fb923c" stroke-width="1.5" fill="none" stroke-dasharray="4,4"/>
  <rect x="270" y="215" width="210" height="20" rx="4" fill="#0f172a"/>
  <text x="375" y="229" text-anchor="middle" fill="#fb923c" font-family="monospace" font-size="10" font-weight="600">Process Timeout (skip retries)</text>

  <rect x="30" y="260" width="840" height="65" rx="8" fill="#1e293b"/>
  <text x="50" y="282" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="600">RETRYABLE:</text>
  <text x="140" y="282" fill="#67e8f9" font-family="monospace" font-size="10">rate limit (429) | server error (503) | ECONNRESET | ETIMEDOUT</text>
  <text x="50" y="300" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="600">NON-RETRYABLE:</text>
  <text x="165" y="300" fill="#fb923c" font-family="monospace" font-size="10">process timeout | auth error | permanent failure</text>
  <text x="50" y="318" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="600">ABORT-AWARE:</text>
  <text x="155" y="318" fill="#f87171" font-family="monospace" font-size="10">AbortSignal cancels process + stops retries + interrupts backoff sleep</text>
</svg>
