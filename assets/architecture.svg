  <text x="40" y="278" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600">MCP TOOLS</text>

  <rect x="40" y="286" width="168" height="40" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
  <text x="124" y="310" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="12" font-weight="600">cli_execute</text>

  <rect x="228" y="286" width="148" height="40" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
  <text x="302" y="310" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="12" font-weight="600">cli_route</text>

