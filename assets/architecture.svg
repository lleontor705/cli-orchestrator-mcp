<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <!-- Background -->
  <rect width="900" height="520" rx="12" fill="#0f172a"/>
  <rect width="900" height="520" rx="12" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="20" font-weight="700">Architecture Overview</text>
  <line x1="300" y1="48" x2="600" y2="48" stroke="#6366f1" stroke-width="2" opacity="0.5"/>

  <!-- Layer 1: MCP Clients -->
  <text x="40" y="82" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600">MCP CLIENTS</text>

  <rect x="40" y="92" width="130" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="105" y="118" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="600">Claude Code</text>

  <rect x="190" y="92" width="130" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="255" y="118" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="600">Codex CLI</text>

  <rect x="340" y="92" width="130" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="405" y="118" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="600">Gemini CLI</text>

  <rect x="490" y="92" width="130" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="555" y="118" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="600">OpenCode</text>

  <rect x="640" y="92" width="130" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="705" y="118" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="13" font-weight="600">Any MCP Client</text>

  <!-- Arrow: Clients to Server -->
  <line x1="400" y1="140" x2="400" y2="168" stroke="#6366f1" stroke-width="2"/>
  <polygon points="394,168 400,178 406,168" fill="#6366f1"/>
  <text x="420" y="160" fill="#94a3b8" font-family="monospace" font-size="10">stdio</text>

  <!-- Layer 2: MCP Server -->
  <rect x="200" y="182" width="500" height="50" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="450" y="210" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="17" font-weight="700">cli-orchestrator-mcp</text>
  <text x="450" y="226" text-anchor="middle" fill="#818cf8" font-family="monospace" font-size="10">@modelcontextprotocol/sdk</text>

  <!-- Arrow: Server to Tools -->
  <line x1="400" y1="234" x2="400" y2="258" stroke="#6366f1" stroke-width="2"/>
  <polygon points="394,258 400,268 406,258" fill="#6366f1"/>

