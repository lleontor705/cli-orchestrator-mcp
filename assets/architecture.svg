  <text x="40" y="378" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600">RESILIENCE PIPELINE</text>

  <rect x="40" y="386" width="820" height="52" rx="8" fill="#0c4a6e" stroke="#0891b2" stroke-width="1"/>

  <rect x="55" y="396" width="110" height="32" rx="5" fill="#164e63" stroke="#22d3ee" stroke-width="1"/>
  <text x="110" y="416" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="600">Global Budget</text>

  <polygon points="172,408 182,412 172,416" fill="#475569"/>

  <rect x="190" y="396" width="130" height="32" rx="5" fill="#164e63" stroke="#22d3ee" stroke-width="1"/>
  <text x="255" y="416" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="600">Circuit Breaker</text>

  <polygon points="327,408 337,412 327,416" fill="#475569"/>

  <rect x="345" y="396" width="100" height="32" rx="5" fill="#164e63" stroke="#22d3ee" stroke-width="1"/>
  <text x="395" y="416" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="600">Execute CLI</text>

  <polygon points="452,408 462,412 452,416" fill="#475569"/>

  <rect x="470" y="396" width="120" height="32" rx="5" fill="#164e63" stroke="#22d3ee" stroke-width="1"/>
  <text x="530" y="416" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="600">Retry+Backoff</text>

  <polygon points="597,408 607,412 597,416" fill="#475569"/>

  <rect x="615" y="396" width="100" height="32" rx="5" fill="#164e63" stroke="#22d3ee" stroke-width="1"/>
  <text x="665" y="416" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="600">Fallback</text>

  <polygon points="722,408 732,412 722,416" fill="#475569"/>

  <rect x="740" y="396" width="105" height="32" rx="5" fill="#164e63" stroke="#22d3ee" stroke-width="1"/>
  <text x="792" y="416" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="600">Redact</text>

  <!-- Arrow: Pipeline to CLI Providers -->
  <line x1="400" y1="440" x2="400" y2="460" stroke="#06b6d4" stroke-width="2"/>
  <polygon points="394,460 400,470 406,460" fill="#06b6d4"/>

  <!-- Layer 5: CLI Providers -->
  <text x="40" y="482" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600">CLI PROVIDERS</text>

  <rect x="120" y="486" width="170" height="30" rx="8" fill="#431407" stroke="#f97316" stroke-width="1.5"/>
  <circle cx="140" cy="501" r="8" fill="#f97316"/>
  <text x="140" y="505" text-anchor="middle" fill="white" font-family="monospace" font-size="9" font-weight="bold">C</text>
  <text x="215" y="505" text-anchor="middle" fill="#fdba74" font-family="monospace" font-size="13" font-weight="600">Claude CLI</text>

  <rect x="365" y="486" width="170" height="30" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="385" cy="501" r="8" fill="#3b82f6"/>
  <text x="385" y="505" text-anchor="middle" fill="white" font-family="monospace" font-size="9" font-weight="bold">G</text>
  <text x="460" y="505" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="13" font-weight="600">Gemini CLI</text>

  <rect x="610" y="486" width="170" height="30" rx="8" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="630" cy="501" r="8" fill="#10b981"/>
  <text x="630" y="505" text-anchor="middle" fill="white" font-family="monospace" font-size="9" font-weight="bold">X</text>
  <text x="705" y="505" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="13" font-weight="600">Codex CLI</text>

  <!-- Fallback arrows -->
  <line x1="290" y1="501" x2="357" y2="501" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>
  <polygon points="357,497 365,501 357,505" fill="#f59e0b" opacity="0.6"/>
  <line x1="535" y1="501" x2="602" y2="501" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>
  <polygon points="602,497 610,501 602,505" fill="#f59e0b" opacity="0.6"/>
  <text x="325" y="494" fill="#fbbf24" font-family="monospace" font-size="9" opacity="0.7">fallback</text>
  <text x="570" y="494" fill="#fbbf24" font-family="monospace" font-size="9" opacity="0.7">fallback</text>
</svg>
