<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1" />
      <stop offset="100%" style="stop-color:#8b5cf6" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4" />
      <stop offset="100%" style="stop-color:#22d3ee" />
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316" />
      <stop offset="100%" style="stop-color:#fb923c" />
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6" />
      <stop offset="100%" style="stop-color:#60a5fa" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981" />
      <stop offset="100%" style="stop-color:#34d399" />
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444" />
      <stop offset="100%" style="stop-color:#f87171" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="12" fill="url(#bgGrad)"/>
  <rect width="900" height="520" rx="12" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#e2e8f0" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700">Architecture Overview</text>
  <line x1="300" y1="48" x2="600" y2="48" stroke="#6366f1" stroke-width="2" opacity="0.5"/>

  <!-- Layer 1: MCP Clients -->
  <text x="40" y="82" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">MCP CLIENTS</text>

  <rect x="40" y="92" width="130" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="105" y="118" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="600">Claude Code</text>

  <rect x="190" y="92" width="130" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="255" y="118" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="600">Codex CLI</text>

  <rect x="340" y="92" width="130" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="405" y="118" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="600">Gemini CLI</text>

  <rect x="490" y="92" width="130" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="555" y="118" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="600">OpenCode</text>

  <rect x="640" y="92" width="130" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="705" y="118" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="13" font-weight="600">Any MCP Client</text>

  <!-- Arrow: Clients → Server -->
  <line x1="400" y1="140" x2="400" y2="168" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="420" y="158" fill="#94a3b8" font-family="monospace" font-size="10">stdio</text>

  <!-- Layer 2: MCP Server -->
  <rect x="200" y="172" width="500" height="50" rx="10" fill="url(#purple)" opacity="0.15" stroke="#6366f1" stroke-width="1.5"/>
  <text x="450" y="202" text-anchor="middle" fill="#a78bfa" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700">cli-orchestrator-mcp</text>
  <text x="450" y="216" text-anchor="middle" fill="#818cf8" font-family="monospace" font-size="10">@modelcontextprotocol/sdk</text>

  <!-- Arrow: Server → Tools -->
  <line x1="400" y1="225" x2="400" y2="250" stroke="#6366f1" stroke-width="2"/>

  <!-- Layer 3: MCP Tools -->
  <text x="40" y="262" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">MCP TOOLS</text>

  <rect x="40" y="270" width="168" height="40" rx="6" fill="url(#purple)" opacity="0.2" stroke="#818cf8" stroke-width="1"/>
  <text x="124" y="294" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="12" font-weight="600">cli_execute</text>

  <rect x="228" y="270" width="148" height="40" rx="6" fill="url(#purple)" opacity="0.2" stroke="#818cf8" stroke-width="1"/>
  <text x="302" y="294" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="12" font-weight="600">cli_route</text>

  <rect x="396" y="270" width="148" height="40" rx="6" fill="url(#purple)" opacity="0.2" stroke="#818cf8" stroke-width="1"/>
  <text x="470" y="294" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="12" font-weight="600">cli_stats</text>

  <rect x="564" y="270" width="148" height="40" rx="6" fill="url(#purple)" opacity="0.2" stroke="#818cf8" stroke-width="1"/>
  <text x="638" y="294" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="12" font-weight="600">cli_list</text>

  <!-- Arrow: cli_execute → Resilience -->
  <line x1="124" y1="312" x2="124" y2="340" stroke="#06b6d4" stroke-width="2"/>

  <!-- Layer 4: Resilience Pipeline -->
  <text x="40" y="356" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">RESILIENCE PIPELINE</text>

  <rect x="40" y="364" width="820" height="52" rx="8" fill="#0c4a6e" opacity="0.2" stroke="#0891b2" stroke-width="1"/>

  <!-- Pipeline steps -->
  <rect x="55" y="374" width="110" height="32" rx="5" fill="url(#cyan)" opacity="0.25" stroke="#22d3ee" stroke-width="1"/>
  <text x="110" y="394" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="600">Global Budget</text>

  <text x="178" y="394" fill="#475569" font-family="monospace" font-size="16">&rarr;</text>

  <rect x="195" y="374" width="130" height="32" rx="5" fill="url(#cyan)" opacity="0.25" stroke="#22d3ee" stroke-width="1"/>
  <text x="260" y="394" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="600">Circuit Breaker</text>

  <text x="338" y="394" fill="#475569" font-family="monospace" font-size="16">&rarr;</text>

  <rect x="355" y="374" width="100" height="32" rx="5" fill="url(#cyan)" opacity="0.25" stroke="#22d3ee" stroke-width="1"/>
  <text x="405" y="394" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="600">Execute CLI</text>

  <text x="468" y="394" fill="#475569" font-family="monospace" font-size="16">&rarr;</text>

  <rect x="485" y="374" width="120" height="32" rx="5" fill="url(#cyan)" opacity="0.25" stroke="#22d3ee" stroke-width="1"/>
  <text x="545" y="394" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="600">Retry + Backoff</text>

  <text x="618" y="394" fill="#475569" font-family="monospace" font-size="16">&rarr;</text>

  <rect x="635" y="374" width="100" height="32" rx="5" fill="url(#cyan)" opacity="0.25" stroke="#22d3ee" stroke-width="1"/>
  <text x="685" y="394" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="600">Fallback</text>

  <text x="748" y="394" fill="#475569" font-family="monospace" font-size="16">&rarr;</text>

  <rect x="765" y="374" width="80" height="32" rx="5" fill="url(#cyan)" opacity="0.25" stroke="#22d3ee" stroke-width="1"/>
  <text x="805" y="394" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="600">Redact</text>

  <!-- Arrow: Pipeline → CLI Providers -->
  <line x1="400" y1="418" x2="400" y2="445" stroke="#06b6d4" stroke-width="2"/>

  <!-- Layer 5: CLI Providers -->
  <text x="40" y="458" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">CLI PROVIDERS</text>

  <rect x="120" y="464" width="170" height="44" rx="8" fill="url(#orange)" opacity="0.15" stroke="#f97316" stroke-width="1.5"/>
  <circle cx="145" cy="486" r="10" fill="#f97316" opacity="0.8"/>
  <text x="146" y="490" text-anchor="middle" fill="white" font-family="monospace" font-size="10" font-weight="bold">C</text>
  <text x="215" y="490" text-anchor="middle" fill="#fdba74" font-family="monospace" font-size="14" font-weight="600">Claude CLI</text>

  <rect x="365" y="464" width="170" height="44" rx="8" fill="url(#blue)" opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="390" cy="486" r="10" fill="#3b82f6" opacity="0.8"/>
  <text x="391" y="490" text-anchor="middle" fill="white" font-family="monospace" font-size="10" font-weight="bold">G</text>
  <text x="460" y="490" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="14" font-weight="600">Gemini CLI</text>

  <rect x="610" y="464" width="170" height="44" rx="8" fill="url(#green)" opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="635" cy="486" r="10" fill="#10b981" opacity="0.8"/>
  <text x="636" y="490" text-anchor="middle" fill="white" font-family="monospace" font-size="10" font-weight="bold">X</text>
  <text x="705" y="490" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="14" font-weight="600">Codex CLI</text>

  <!-- Fallback arrows between providers -->
  <path d="M 290 486 L 365 486" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5" marker-end="url(#arrowYellow)"/>
  <path d="M 535 486 L 610 486" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5" marker-end="url(#arrowYellow)"/>
  <text x="328" y="480" fill="#fbbf24" font-family="monospace" font-size="9" opacity="0.7">fallback</text>
  <text x="573" y="480" fill="#fbbf24" font-family="monospace" font-size="9" opacity="0.7">fallback</text>
</svg>
