  <text x="470" y="310" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="12" font-weight="600">cli_stats</text>

  <rect x="564" y="286" width="148" height="40" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
  <text x="638" y="310" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="12" font-weight="600">cli_list</text>

